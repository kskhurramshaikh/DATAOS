<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DataOS 2.0</title>
<link rel="stylesheet" href="/static/vendor/tabulator.min.css">
<script src="/static/vendor/chart.min.js"></script>
<script src="/static/vendor/tabulator.min.js"></script>
<script src="/static/vendor/alpine.min.js" defer></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2e38; --text: #e8e9ed;
    --muted: #8a8f9c; --accent: #5b8cff; --accent-dim: #2b3a5e;
    --user-bubble: #2b3a5e; --bot-bubble: #1f232c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    align-items: center; justify-content: center;
  }
  .hidden { display: none !important; }

  /* Auth screen */
  #auth-screen { width: 360px; }
  #auth-screen h1 { font-size: 22px; margin-bottom: 4px; }
  #auth-screen p.sub { color: var(--muted); margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  button.primary {
    width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--accent);
    color: white; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 6px;
  }
  button.primary:hover { opacity: 0.9; }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .toggle-row { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .toggle-row a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .error-msg { color: #ff6b6b; font-size: 13px; margin-top: 8px; min-height: 16px; }

  /* Chat screen */
  #chat-screen {
    width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column;
  }
  #chat-header {
    padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center;
  }
  #chat-header .title { font-weight: 700; font-size: 15px; }
  #chat-header .sub { color: var(--muted); font-size: 12px; }
  #logout-btn { background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  #logout-btn:hover { color: var(--text); border-color: var(--muted); }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); border-bottom-left-radius: 4px; max-width: 88%; }

  /* Animated status line while work is happening */
  .status-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .status-text { transition: opacity 0.15s ease; }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%; background: var(--muted);
    animation: dot-pulse 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-pulse {
    0%, 60%, 100% { opacity: 0.25; transform: scale(0.85); }
    30% { opacity: 1; transform: scale(1); }
  }

  .final-text { margin-top: 6px; }
  .final-text:first-child { margin-top: 0; }
  .final-text p { margin: 0 0 8px 0; }
  .final-text p:last-child { margin-bottom: 0; }
  .final-text ul { margin: 2px 0 10px 0; padding-left: 20px; }
  .final-text ul:last-child { margin-bottom: 0; }
  .final-text li { margin-bottom: 5px; }
  .final-text li:last-child { margin-bottom: 0; }
  .final-text strong { color: #fff; font-weight: 700; }

  /* Expandable "show your work" tree */
  .tool-details { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  .tool-details summary {
    cursor: pointer; font-size: 12px; color: var(--muted); user-select: none; list-style: none;
  }
  .tool-details summary::-webkit-details-marker { display: none; }
  .tool-details summary::before { content: "▸ "; }
  .tool-details[open] summary::before { content: "▾ "; }
  .tool-details summary:hover { color: var(--text); }
  .tool-entry { margin-top: 8px; }
  .tool-entry-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tool-entry pre {
    margin: 0; background: #0a0b0e; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; line-height: 1.5; overflow-x: auto;
    font-family: "SF Mono", Consolas, Monaco, monospace; color: #b8c4d9;
    max-height: 260px; overflow-y: auto;
  }
  .error-text { color: #ff6b6b; }

  /* Charts -- rendered inline, always visible, never buried in details */
  .chart-block { margin-top: 12px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px; }
  .chart-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; font-weight: 600; }
  .chart-block canvas { max-height: 220px; }
  .chart-alt-note { font-size: 11px; color: var(--muted); margin-top: 8px; font-style: italic; }

  /* Inline components (component_type/component_data payloads) --
     structured views embedded directly in the chat bubble, per Dr.
     Saber's Banking Demo Requirements v2 spec. */
  .components-container { margin-top: 4px; }
  .comp-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px; margin-top: 10px;
  }
  .comp-title { font-size: 12px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .comp-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
  .comp-tile { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .comp-tile-value { font-size: 18px; font-weight: 700; color: var(--text); }
  .comp-tile-value.good { color: #5bdc8c; }
  .comp-tile-value.warn { color: #ffbe5a; }
  .comp-tile-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .comp-ecl-headline { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .comp-ecl-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .comp-donut-row { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .comp-donut-row canvas { max-width: 140px; max-height: 140px; }
  .comp-stage-legend { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .comp-stage-legend .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .comp-risk-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  .comp-risk-table th {
    text-align: left; color: var(--muted); font-weight: 600; padding: 6px 8px;
    border-bottom: 1px solid var(--border); font-size: 10.5px; text-transform: uppercase;
  }
  .comp-risk-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text); }
  .comp-risk-table tr:last-child td { border-bottom: none; }
  .comp-section-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; margin: 14px 0 8px; }
  .comp-note { font-size: 11.5px; color: var(--muted); margin-top: 10px; font-style: italic; }

  /* Duplicate review -- redesigned for a non-technical reviewer (bank
     exec), not a data analyst. Cards lead with a plain-language
     statement of what's being asked ("Likely the same person") and a
     human-readable reason, not a raw table of row IDs. A summary bar
     at the top shows review progress and offers a one-click batch
     action for the obvious (high-confidence) matches, since a real
     file can surface dozens of groups (Dr. Saber's test file: 71).
     Native <details> expand kept for the same reason as before --
     Tabulator's fixed-width grid squeezes action buttons in the
     narrow chat bubble. */
  .review-container { margin-top: 4px; }
  .review-summary {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 10px; flex-wrap: wrap;
  }
  .review-summary-text { font-size: 13px; color: var(--text); }
  .review-summary-text b { color: var(--text); }
  .review-summary-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .review-batch-btn {
    padding: 8px 14px; border-radius: 6px; border: 1px solid #5bdc8c; background: rgba(91,220,140,0.10);
    color: #5bdc8c; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .review-batch-btn:hover { background: rgba(91,220,140,0.18); }
  .review-batch-btn:disabled { opacity: 0.5; cursor: default; }
  .review-audit-link {
    background: none; border: none; color: var(--muted); font-size: 12px;
    text-decoration: underline; cursor: pointer; padding: 0;
  }
  .review-audit-link:hover { color: var(--text); }
  .audit-modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .audit-modal-backdrop.hidden { display: none; }
  .audit-modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    width: 100%; max-width: 860px; max-height: 84vh; display: flex; flex-direction: column;
  }
  .audit-modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .audit-modal-header h3 { font-size: 15px; color: var(--text); }
  .audit-modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; line-height: 1; }
  .audit-modal-close:hover { color: var(--text); }

  .audit-stats {
    display: flex; gap: 22px; padding: 14px 20px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .audit-stat { display: flex; flex-direction: column; gap: 2px; }
  .audit-stat-value { font-size: 18px; font-weight: 700; color: var(--text); font-family: "SF Mono", Consolas, Monaco, monospace; }
  .audit-stat-value.confirmed { color: #5bdc8c; }
  .audit-stat-value.rejected { color: #ffbe5a; }
  .audit-stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

  .audit-toolbar { padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .audit-search {
    width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 12.5px; outline: none;
  }
  .audit-search:focus { border-color: var(--accent); }
  .audit-search::placeholder { color: var(--muted); }

  .audit-table-wrap { overflow-y: auto; flex: 1; }
  .audit-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .audit-table thead th {
    position: sticky; top: 0; z-index: 1;
    text-align: left; color: var(--muted); font-weight: 600; padding: 9px 20px;
    background: var(--panel); border-bottom: 1px solid var(--border); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .audit-table td { padding: 9px 20px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: top; }
  .audit-table tbody tr:hover { background: rgba(255,255,255,0.02); }
  .audit-table tbody tr.audit-row-hidden { display: none; }
  .audit-cell-name { font-weight: 600; white-space: nowrap; }
  .audit-cell-reviewer { color: var(--muted); font-family: "SF Mono", Consolas, Monaco, monospace; font-size: 11.5px; }
  .audit-cell-time { color: var(--muted); font-family: "SF Mono", Consolas, Monaco, monospace; font-size: 11px; white-space: nowrap; }
  .audit-pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .audit-pill.confirmed { background: rgba(91, 220, 140, 0.14); color: #5bdc8c; }
  .audit-pill.rejected { background: rgba(255, 190, 90, 0.14); color: #ffbe5a; }
  .audit-empty { color: var(--muted); font-size: 13px; padding: 30px 20px; text-align: center; }
  .review-list { display: flex; flex-direction: column; gap: 8px; }
  .review-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .review-card.is-decided { opacity: 0.6; }
  .review-card-top {
    display: flex; align-items: flex-start; gap: 10px;
  }
  .review-card-headline { display: flex; flex-direction: column; gap: 3px; flex: 1; }
  .review-card-title { font-size: 14px; color: var(--text); font-weight: 600; }
  .review-card-reason { font-size: 12px; color: var(--muted); }
  .match-badge {
    padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0;
    display: inline-flex; align-items: center; gap: 4px; margin-top: 1px;
  }
  .match-high { background: rgba(91, 220, 140, 0.18); color: #5bdc8c; }
  .match-review { background: rgba(255, 190, 90, 0.18); color: #ffbe5a; }
  .record-details { margin-top: 10px; }
  .record-toggle {
    cursor: pointer; list-style: none; font-size: 11.5px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .record-toggle::-webkit-details-marker { display: none; }
  .record-toggle::before { content: "▸"; }
  .record-details[open] .record-toggle::before { content: "▾"; }
  .record-toggle:hover { color: var(--text); }
  .record-list { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .record-row {
    display: flex; align-items: baseline; gap: 10px; font-size: 12.5px;
    padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
  }
  .record-row-name { color: var(--text); font-weight: 600; min-width: 140px; }
  .record-row-meta { color: var(--muted); flex: 1; }
  .record-row-id { color: var(--muted); font-size: 10.5px; font-family: "SF Mono", Consolas, Monaco, monospace; }
  .review-actions { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .review-btn {
    padding: 7px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 12px; cursor: pointer;
  }
  .review-btn.confirm { border-color: #5bdc8c; color: #5bdc8c; }
  .review-btn.confirm:hover { background: rgba(91,220,140,0.10); }
  .review-btn.reject:hover { border-color: var(--muted); }
  .review-btn:disabled { opacity: 0.5; cursor: wait; }
  .review-note { font-size: 11px; color: var(--muted); margin-top: 8px; font-style: italic; }
  .decision-done { font-size: 12px; color: #5bdc8c; font-weight: 600; }

  /* Recommendation chips -- what the user can do next with this dataset */
  .reco-header { font-size: 13px; color: var(--muted); margin-top: 4px; margin-bottom: 8px; }
  .reco-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .reco-chip {
    padding: 9px 14px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .reco-chip:hover { border-color: var(--accent); background: var(--accent-dim); }
  .reco-chip:disabled { opacity: 0.5; cursor: wait; }

  /* Pipeline log -- the permanent trail of every stage the request
     actually went through (compliance -> routing -> tool, or
     Bronze -> Silver -> Gold), kept visible after the reply lands. */
  .pipeline-log { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .pipeline-log-line {
    font-size: 12px; color: var(--muted); font-family: "SF Mono", Consolas, Monaco, monospace;
  }
  .route-callout {
    font-size: 12px; color: var(--accent); margin-bottom: 6px; font-weight: 600;
  }

  #composer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; position: relative; }
  #composer input {
    flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  #composer input:focus { outline: none; border-color: var(--accent); }
  #composer button {
    padding: 0 18px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-weight: 600; cursor: pointer; font-size: 14px;
  }
  #composer button:disabled { opacity: 0.5; cursor: not-allowed; }

  #plus-btn {
    width: 44px; padding: 0; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 20px; font-weight: 400;
    cursor: pointer; flex-shrink: 0;
  }
  #plus-btn:hover { border-color: var(--accent); color: var(--accent); }

  #plus-menu {
    position: absolute; bottom: 62px; left: 20px; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 6px;
    min-width: 180px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  #plus-menu .menu-item {
    padding: 10px 12px; border-radius: 6px; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  #plus-menu .menu-item:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>DataOS 2.0</h1>
  <p class="sub" id="auth-sub">Sign in to start.</p>

  <div id="login-form">
    <div class="field"><label>Email</label><input type="email" id="login-email"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password"></div>
    <button class="primary" id="login-btn">Log in</button>
    <div class="error-msg" id="login-error"></div>
    <div class="toggle-row">New here? <a id="show-signup">Create an account</a></div>
  </div>

  <div id="signup-form" class="hidden">
    <div class="field"><label>Name</label><input type="text" id="signup-name"></div>
    <div class="field"><label>Email</label><input type="email" id="signup-email"></div>
    <div class="field"><label>Password</label><input type="password" id="signup-password"></div>
    <button class="primary" id="signup-btn">Sign up</button>
    <div class="error-msg" id="signup-error"></div>
    <div class="toggle-row">Already have an account? <a id="show-login">Log in</a></div>
  </div>
</div>

<div id="chat-screen" class="hidden">
  <div id="chat-header">
    <div>
      <div class="title">DataOS 2.0</div>
      <div class="sub" id="user-greeting"></div>
    </div>
    <button id="logout-btn">Log out</button>
  </div>
  <div id="messages"></div>
  <div id="composer">
    <button id="plus-btn" title="Add">+</button>
    <div id="plus-menu" class="hidden">
      <div class="menu-item" id="add-dataset-item">📊 Add dataset</div>
    </div>
    <input type="file" id="dataset-file-input" accept=".csv,.xlsx,.xls" class="hidden">
    <input type="text" id="chat-input" placeholder="Ask DataOS anything...">
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
const API = "";
let token = null;
let conversationId = null;
let lastUploadedFile = null; // kept in memory so a recommendation chip can re-run an
                              // analysis against the same workbook without re-uploading

const $ = (id) => document.getElementById(id);

// Setting scrollTop = scrollHeight immediately after a DOM change can
// land just short of the real bottom, because the browser hasn't
// finished laying out the new content yet at that exact instant.
// Deferring to the next animation frame guarantees layout is settled
// first, so this always actually reaches the bottom.
function scrollMessagesToBottom() {
  requestAnimationFrame(() => {
    const el = $("messages");
    el.scrollTop = el.scrollHeight;
  });
}

function showSignup() {
  $("login-form").classList.add("hidden");
  $("signup-form").classList.remove("hidden");
}
function showLogin() {
  $("signup-form").classList.add("hidden");
  $("login-form").classList.remove("hidden");
}
$("show-signup").onclick = showSignup;
$("show-login").onclick = showLogin;

async function api(path, body, useAuth) {
  const headers = { "Content-Type": "application/json" };
  if (useAuth && token) headers["Authorization"] = "Bearer " + token;
  const res = await fetch(API + path, {
    method: "POST",
    headers,
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.detail || "Something went wrong.");
  return data;
}

$("signup-btn").onclick = async () => {
  $("signup-error").textContent = "";
  try {
    const data = await api("/auth/signup", {
      name: $("signup-name").value,
      email: $("signup-email").value,
      password: $("signup-password").value,
    });
    onAuthed(data.token, data.user);
  } catch (e) {
    $("signup-error").textContent = e.message;
  }
};

$("login-btn").onclick = async () => {
  $("login-error").textContent = "";
  try {
    const data = await api("/auth/login", {
      email: $("login-email").value,
      password: $("login-password").value,
    });
    onAuthed(data.token, data.user);
  } catch (e) {
    $("login-error").textContent = e.message;
  }
};

function onAuthed(t, user) {
  token = t;
  localStorage.setItem("dataos_token", t);
  $("auth-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");

// Duplicate-review audit log -- a durable record independent of the
// chat scroll. This is what a bank reviewer pulls up later to see who
// decided what and when, separate from any one conversation. Built as
// a real table with a stats strip and search rather than stacked
// cards -- a fully-reviewed file can produce hundreds of decisions,
// and a card per row doesn't stay scannable at that scale.
const auditBackdrop = document.createElement("div");
auditBackdrop.className = "audit-modal-backdrop hidden";
auditBackdrop.innerHTML = `
  <div class="audit-modal">
    <div class="audit-modal-header">
      <h3>Duplicate review -- audit log</h3>
      <button class="audit-modal-close" aria-label="Close">&times;</button>
    </div>
    <div class="audit-stats" id="audit-stats"></div>
    <div class="audit-toolbar">
      <input type="text" class="audit-search" id="audit-search" placeholder="Search by customer or reviewer..." />
    </div>

  </div>
`;
document.body.appendChild(auditBackdrop);
auditBackdrop.querySelector(".audit-modal-close").onclick = () => auditBackdrop.classList.add("hidden");

document.getElementById("audit-search").addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll("#audit-table-wrap tbody tr").forEach((row) => {
    const match = row.dataset.search.includes(q);
    row.classList.toggle("audit-row-hidden", !match);
  });
});

async function openAuditLog(datasetName) {
  const statsEl = document.getElementById("audit-stats");
  const wrapEl = document.getElementById("audit-table-wrap");
  const searchEl = document.getElementById("audit-search");
  searchEl.value = "";
  statsEl.innerHTML = "";
  wrapEl.innerHTML = `<div class="audit-empty">Loading...</div>`;

  auditBackdrop.classList.remove("hidden");
  try {
    const res = await fetch(API + "/duplicates/audit-log?dataset_name=" + encodeURIComponent(datasetName), {
      headers: { "Authorization": "Bearer " + token },
    });
    if (!res.ok) throw new Error("Failed to load audit log");
    const { entries } = await res.json();
    if (!entries.length) {
      wrapEl.innerHTML = `<div class="audit-empty">No decisions recorded yet for this dataset.</div>`;
      return;
    }

    const confirmedCount = entries.filter((e) => e.status === "confirmed_duplicate").length;
    const rejectedCount = entries.length - confirmedCount;
    const reviewers = new Set(entries.map((e) => e.decided_by || "unknown"));

    statsEl.innerHTML = `
      <div class="audit-stat">
        <div class="audit-stat-value">${entries.length}</div>
        <div class="audit-stat-label">Total decisions</div>
      </div>
      <div class="audit-stat">
        <div class="audit-stat-value confirmed">${confirmedCount}</div>
        <div class="audit-stat-label">Confirmed duplicates</div>
      </div>
      <div class="audit-stat">
        <div class="audit-stat-value rejected">${rejectedCount}</div>
        <div class="audit-stat-label">Marked different</div>
      </div>
      <div class="audit-stat">
        <div class="audit-stat-value">${reviewers.size}</div>
        <div class="audit-stat-label">Reviewer${reviewers.size === 1 ? "" : "s"}</div>
      </div>
    `;

    const rows = entries.map((e) => {
      const names = [...new Set(e.members.map((m) => m.name))].join(" / ");
      const confirmed = e.status === "confirmed_duplicate";
      const reviewer = e.decided_by || "unknown";
      const decidedAt = e.decided_at || "unknown";
      const searchKey = (names + " " + reviewer).toLowerCase();
      return `
        <tr data-search="${escapeHtml(searchKey)}">
          <td class="audit-cell-name">${escapeHtml(names)}</td>
          <td><span class="audit-pill ${confirmed ? "confirmed" : "rejected"}">${confirmed ? "Confirmed" : "Different people"}</span></td>
          <td class="audit-cell-reviewer">${escapeHtml(reviewer)}</td>
          <td class="audit-cell-time">${escapeHtml(decidedAt)}</td>
        </tr>
      `;
    }).join("");

    wrapEl.innerHTML = `
      <table class="audit-table">
        <thead>
          <tr>
            <th>Customer</th>
            <th>Decision</th>
            <th>Reviewer</th>
            <th>Decided at</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  } catch (err) {
    wrapEl.innerHTML = `<div class="audit-empty">Could not load the audit log: ${escapeHtml(err.message)}</div>`;
  }
}

// Lightweight markdown -> HTML: bold and bullet lists only, which is
// all the reply-formatting prompt ever asks the model to use. Escapes
// first so nothing in the text can inject markup.
function renderMarkdownLite(text) {
  const escaped = escapeHtml(text);
  const lines = escaped.split("\n");
  let html = "";
  let inList = false;

  for (const rawLine of lines) {
    const line = rawLine.trim();
    const isBullet = line.startsWith("- ") || line.startsWith("* ");
    const isEmptyBulletMarker = line === "-" || line === "*";

    if (isEmptyBulletMarker) continue; // stray/incomplete marker, e.g. a truncated reply

    if (isBullet && !inList) { html += "<ul>"; inList = true; }
    if (!isBullet && inList) { html += "</ul>"; inList = false; }

    if (isBullet) {
      html += "<li>" + line.slice(2) + "</li>";
    } else if (line !== "") {
      html += "<p>" + line + "</p>";
    }
  }
  if (inList) html += "</ul>";

  return html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
}

// Creates a bot message bubble that streams: animated dots + a status
// label that updates live, an expandable "show your work" tree that
// keeps every stage the pipeline actually went through (Bronze ->
// Silver -> Gold, or compliance -> routing -> tool), not just the
// final blob -- DataOS is fundamentally about tool orchestration, so
// the orchestration itself has to stay visible after the fact.
function addStreamingBotMessage() {
  const div = document.createElement("div");
  div.className = "msg bot";

  const statusLine = document.createElement("div");
  statusLine.className = "status-line";
  statusLine.innerHTML =
    '<span class="typing-dots"><span></span><span></span><span></span></span>' +
    '<span class="status-text">Thinking...</span>';

  const finalText = document.createElement("div");
  finalText.className = "final-text hidden";

  const componentsContainer = document.createElement("div");
  componentsContainer.className = "components-container hidden";

  const chartsContainer = document.createElement("div");
  chartsContainer.className = "charts-container hidden";

  const reviewContainer = document.createElement("div");
  reviewContainer.className = "review-container hidden";

  const recoContainer = document.createElement("div");
  recoContainer.className = "reco-container hidden";

  const details = document.createElement("details");
  details.className = "tool-details hidden";
  const summary = document.createElement("summary");
  summary.textContent = "View details";

  const pipelineLog = document.createElement("div");
  pipelineLog.className = "pipeline-log";

  const detailBody = document.createElement("div");

  details.appendChild(summary);
  details.appendChild(pipelineLog);
  details.appendChild(detailBody);

  div.appendChild(statusLine);
  div.appendChild(reviewContainer);
  div.appendChild(componentsContainer);
  div.appendChild(chartsContainer);
  div.appendChild(finalText);
  div.appendChild(recoContainer);
  div.appendChild(details);
  $("messages").appendChild(div);
  scrollMessagesToBottom();

  let stepNum = 0;
  let chartCounter = 0;

  return {
    setStatus(label) {
      statusLine.querySelector(".status-text").textContent = label;

      // Every stage the pipeline actually passes through gets logged
      // here permanently, in order -- this is the orchestration trail.
      details.classList.remove("hidden");
      stepNum += 1;
      const line = document.createElement("div");
      line.className = "pipeline-log-line";
      line.textContent = `${stepNum}. ${label}`;
      pipelineLog.appendChild(line);
      scrollMessagesToBottom();
    },
    addDetail(label, data) {
      details.classList.remove("hidden");
      const entry = document.createElement("div");
      entry.className = "tool-entry";

      const entryLabel = document.createElement("div");
      entryLabel.className = "tool-entry-label";
      entryLabel.textContent = label;
      entry.appendChild(entryLabel);

      // If this result carries routing info (which real capability and
      // tool actually ran), call that out as its own visible line.
      // Deliberately NOT dumping the raw JSON result here anymore --
      // "View details" now only ever shows the orchestration trail
      // (the pipeline-log steps above) and this routing line, never
      // the underlying technical output. That's true for every intent,
      // not just duplicate detection.
      const routing = data && data.routing;
      if (routing) {
        const routeLine = document.createElement("div");
        routeLine.className = "route-callout";
        routeLine.textContent = `→ Routed to capability "${routing.capability}", tool "${routing.tool}"`;
        entry.appendChild(routeLine);
      }

      detailBody.appendChild(entry);
      scrollMessagesToBottom();
    },
    addCharts(charts) {
      chartsContainer.classList.remove("hidden");
      for (const spec of charts) {
        chartCounter += 1;
        const block = document.createElement("div");
        block.className = "chart-block";

        const title = document.createElement("div");
        title.className = "chart-title";
        title.textContent = spec.title || "Chart";
        block.appendChild(title);

        const canvas = document.createElement("canvas");
        canvas.id = `chart-${Date.now()}-${chartCounter}`;
        block.appendChild(canvas);

        chartsContainer.appendChild(block);

        new Chart(canvas.getContext("2d"), {
          type: spec.type || "bar",
          data: {
            labels: spec.labels || [],
            datasets: [{
              data: spec.values || [],
              backgroundColor: "rgba(91, 140, 255, 0.55)",
              borderColor: "rgba(91, 140, 255, 1)",
              borderWidth: 1,
            }],
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } },
          },
        });
      }
      scrollMessagesToBottom();
    },
    addComponent(componentType, componentData) {
      componentsContainer.classList.remove("hidden");
      if (componentType === "processing_summary") {
        renderProcessingSummaryCard(componentsContainer, componentData);
      } else if (componentType === "ifrs9_ecl") {
        renderIFRS9ECLView(componentsContainer, componentData);
      } else if (componentType === "duplicate_clusters") {
        renderDuplicateClustersSummary(componentsContainer, componentData);
      }
      scrollMessagesToBottom();
    },
    addRecommendations(datasetName, options) {
      recoContainer.classList.remove("hidden");

      const header = document.createElement("div");
      header.className = "reco-header";
      header.textContent = "What would you like to do with this dataset?";
      recoContainer.appendChild(header);

      const chipRow = document.createElement("div");
      chipRow.className = "reco-chip-row";

      for (const opt of options) {
        const chip = document.createElement("button");
        chip.className = "reco-chip";
        chip.textContent = opt.label;
        chip.title = opt.description || "";
        chip.onclick = async () => {
          chipRow.querySelectorAll(".reco-chip").forEach((b) => (b.disabled = true));
          addMessage("user", opt.label);
          await streamRequest({ file: lastUploadedFile, dataset_name: datasetName, action: opt.action, scenario: opt.scenario });
          chipRow.querySelectorAll(".reco-chip").forEach((b) => (b.disabled = false));
        };
        chipRow.appendChild(chip);
      }

      recoContainer.appendChild(chipRow);
      scrollMessagesToBottom();
    },
    addDuplicateReview(datasetName, clusters) {
      reviewContainer.classList.remove("hidden");

      const total = clusters.length;
      const highCount = clusters.filter((c) => c.confidence_tier === "high_confidence").length;
      let decidedCount = 0;

      const summary = document.createElement("div");
      summary.className = "review-summary";

      const summaryText = document.createElement("div");
      const summaryMain = document.createElement("div");
      summaryMain.className = "review-summary-text";
      summaryMain.innerHTML = `<b>${total}</b> group${total === 1 ? "" : "s"} of records look like they might be the same customer`;
      const summarySub = document.createElement("div");
      summarySub.className = "review-summary-sub";
      summarySub.id = `review-progress-${datasetName}`.replace(/[^a-zA-Z0-9_-]/g, "");
      summarySub.textContent = `0 of ${total} reviewed`;
      summaryText.appendChild(summaryMain);
      summaryText.appendChild(summarySub);
      summary.appendChild(summaryText);

      let batchBtn = null;
      if (highCount > 1) {
        batchBtn = document.createElement("button");
        batchBtn.className = "review-batch-btn";
        batchBtn.textContent = `Confirm all ${highCount} likely matches`;
        summary.appendChild(batchBtn);
      }

      const summaryActions = document.createElement("div");
      summaryActions.style.display = "flex";
      summaryActions.style.gap = "14px";
      summaryActions.style.alignItems = "center";
      if (batchBtn) summaryActions.appendChild(batchBtn);
      const auditLink = document.createElement("button");
      auditLink.className = "review-audit-link";
      auditLink.textContent = "View audit log";
      auditLink.onclick = () => openAuditLog(datasetName);
      summaryActions.appendChild(auditLink);
      summary.appendChild(summaryActions);

      reviewContainer.appendChild(summary);

      const note = document.createElement("div");
      note.className = "review-note";
      note.textContent = "Confirming a group records your decision for compliance review -- it does not merge or change any customer record automatically.";
      reviewContainer.appendChild(note);

      const list = document.createElement("div");
      list.className = "review-list";
      reviewContainer.appendChild(list);

      const updateProgress = () => {
        summarySub.textContent = `${decidedCount} of ${total} reviewed`;
        if (batchBtn && decidedCount === total) batchBtn.remove();
      };

      const cardHandlers = [];

      for (const cluster of clusters) {
        const isHigh = cluster.confidence_tier === "high_confidence";
        const uniqueNames = [...new Set(cluster.members.map((m) => m.name))];

        // Plain-language reason: what actually matched across every member.
        const dobs = new Set(cluster.members.map((m) => m.dob));
        const phones = new Set(cluster.members.map((m) => m.phone || ""));
        const reasons = [];
        if (dobs.size === 1 && cluster.members[0].dob) reasons.push("same date of birth");
        if (phones.size === 1 && [...phones][0]) reasons.push("same phone number");
        if (uniqueNames.length === 1) reasons.push("identical name");
        const reasonText = reasons.length
          ? `Flagged because: ${reasons.join(", ")}`
          : "Flagged as a likely match by the review model";

        const card = document.createElement("div");
        card.className = "review-card";

        const cardTop = document.createElement("div");
        cardTop.className = "review-card-top";

        const badge = document.createElement("span");
        badge.className = "match-badge " + (isHigh ? "match-high" : "match-review");
        badge.textContent = isHigh ? "Likely match" : "Please check";

        const headline = document.createElement("div");
        headline.className = "review-card-headline";
        const title = document.createElement("div");
        title.className = "review-card-title";
        title.textContent = `${cluster.size} records -- ${uniqueNames.join(" / ")}`;
        const reasonEl = document.createElement("div");
        reasonEl.className = "review-card-reason";
        reasonEl.textContent = reasonText;
        headline.appendChild(title);
        headline.appendChild(reasonEl);

        cardTop.appendChild(badge);
        cardTop.appendChild(headline);
        card.appendChild(cardTop);

        const actions = document.createElement("div");
        actions.className = "review-actions";

        const confirmBtn = document.createElement("button");
        confirmBtn.className = "review-btn confirm";
        confirmBtn.textContent = "Yes, same customer";

        const rejectBtn = document.createElement("button");
        rejectBtn.className = "review-btn reject";
        rejectBtn.textContent = "No, different people";

        const statusSpan = document.createElement("span");
        statusSpan.className = "decision-done hidden";

        const decide = async (status, label) => {
          confirmBtn.disabled = true;
          rejectBtn.disabled = true;
          try {
            const res = await fetch(API + "/duplicates/decide", {
              method: "POST",
              headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
              body: JSON.stringify({ cluster_id: cluster.id, status }),
            });
            if (!res.ok) throw new Error("Failed to save decision");
            confirmBtn.remove();
            rejectBtn.remove();
            statusSpan.textContent = "✓ " + label;
            statusSpan.classList.remove("hidden");
            card.classList.add("is-decided");
            decidedCount++;
            updateProgress();
            return true;
          } catch (err) {
            confirmBtn.disabled = false;
            rejectBtn.disabled = false;
            alert("Could not save this decision: " + err.message);
            return false;
          }
        };

        confirmBtn.onclick = () => decide("confirmed_duplicate", "Confirmed duplicate");
        rejectBtn.onclick = () => decide("not_duplicate", "Not a duplicate");

        actions.appendChild(confirmBtn);
        actions.appendChild(rejectBtn);
        actions.appendChild(statusSpan);
        card.appendChild(actions);

        // Raw member rows (name/DOB/phone/row ID) are the only thing
        // behind an optional expand now -- genuinely supplementary
        // detail for double-checking, not required to make the call.
        const recordDetails = document.createElement("details");
        recordDetails.className = "record-details";
        const recordToggle = document.createElement("summary");
        recordToggle.className = "record-toggle";
        recordToggle.textContent = `View ${cluster.size} records`;
        recordDetails.appendChild(recordToggle);

        const recordList = document.createElement("div");
        recordList.className = "record-list";
        for (const m of cluster.members) {
          const row = document.createElement("div");
          row.className = "record-row";
          row.innerHTML =
            `<span class="record-row-name">${escapeHtml(m.name)}</span>` +
            `<span class="record-row-meta">Born ${escapeHtml(m.dob)}${m.phone ? " &middot; " + escapeHtml(m.phone) : ""}</span>` +
            `<span class="record-row-id">${escapeHtml(m.row_id)}</span>`;
          recordList.appendChild(row);
        }
        recordDetails.appendChild(recordList);
        card.appendChild(recordDetails);

        list.appendChild(card);

        if (isHigh) {
          cardHandlers.push(() => confirmBtn.disabled ? Promise.resolve() : decide("confirmed_duplicate", "Confirmed duplicate"));
        }
      }

      if (batchBtn) {
        batchBtn.onclick = async () => {
          batchBtn.disabled = true;
          batchBtn.textContent = "Confirming...";
          for (const run of cardHandlers) {
            await run();
          }
          if (batchBtn) { batchBtn.disabled = false; }
        };
      }

      scrollMessagesToBottom();
    },
    setFinal(text) {
      statusLine.remove();
      finalText.innerHTML = renderMarkdownLite(text);
      finalText.classList.remove("hidden");
      scrollMessagesToBottom();
    },
    setError(text) {
      statusLine.remove();
      finalText.textContent = text;
      finalText.classList.add("error-text");
      finalText.classList.remove("hidden");
      scrollMessagesToBottom();
    },
  };
}

function handleStreamEvent(bubble, eventType, data) {
  if (eventType === "status") {
    bubble.setStatus(data.label);
  } else if (eventType === "tool_call") {
    bubble.addDetail("Calling intent: " + data.name, data.input);
  } else if (eventType === "tool_result") {
    bubble.addDetail("Result", data.data);
  } else if (eventType === "visualization") {
    bubble.addCharts(data.charts);
  } else if (eventType === "duplicate_review") {
    bubble.addDuplicateReview(data.dataset_name, data.clusters);
  } else if (eventType === "component") {
    bubble.addComponent(data.component_type, data.component_data);
  } else if (eventType === "recommendations") {
    bubble.addRecommendations(data.dataset_name, data.options);
  } else if (eventType === "final") {
    conversationId = data.conversation_id;
    bubble.setFinal(data.reply);
  } else if (eventType === "error") {
    bubble.setError("Something went wrong: " + data.detail);
  }
}

// Unified SSE request -- handles both a plain text message and a file
// upload through the same streaming endpoint. Manually parses SSE
// frames from a fetch ReadableStream, since EventSource can't POST
// with auth headers or multipart bodies.
async function streamRequest({ message, file, dataset_name, action, scenario }) {
  const bubble = addStreamingBotMessage();
  $("send-btn").disabled = true;

  try {
    const form = new FormData();
    if (message) form.append("message", message);
    if (file) form.append("file", file);
    if (dataset_name) form.append("dataset_name", dataset_name);
    if (action) form.append("action", action);
    if (scenario) form.append("scenario", scenario);
    if (conversationId) form.append("conversation_id", conversationId);

    const res = await fetch(API + "/chat/stream", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token },
      body: form,
    });

    if (!res.ok || !res.body) {
      let detail = "Something went wrong.";
      try { detail = (await res.json()).detail || detail; } catch (e) {}
      bubble.setError(detail);
      return;
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const frames = buffer.split("\n\n");
      buffer = frames.pop(); // keep the possibly-incomplete last frame

      for (const frame of frames) {
        if (!frame.trim()) continue;
        let eventType = "message";
        let dataStr = "";
        for (const line of frame.split("\n")) {
          if (line.startsWith("event: ")) eventType = line.slice(7);
          else if (line.startsWith("data: ")) dataStr += line.slice(6);
        }
        if (!dataStr) continue;
        try {
          handleStreamEvent(bubble, eventType, JSON.parse(dataStr));
        } catch (e) { /* ignore malformed frame */ }
      }
    }
  } catch (e) {
    bubble.setError(e.message);
  } finally {
    $("send-btn").disabled = false;
  }
}

async function sendMessage() {
  const input = $("chat-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";

  addMessage("user", text);
  await streamRequest({ message: text });
  input.focus();
}

$("send-btn").onclick = sendMessage;
$("chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMessage(); });

// "+" menu -- just like a chat app's attach menu
$("plus-btn").onclick = (e) => {
  e.stopPropagation();
  $("plus-menu").classList.toggle("hidden");
};
document.addEventListener("click", (e) => {
  if (!$("plus-menu").contains(e.target) && e.target !== $("plus-btn")) {
    $("plus-menu").classList.add("hidden");
  }
});

$("add-dataset-item").onclick = () => {
  $("plus-menu").classList.add("hidden");
  $("dataset-file-input").click();
};

$("dataset-file-input").addEventListener("change", async () => {
  const input = $("dataset-file-input");
  const file = input.files[0];
  if (!file) return;

  const defaultName = file.name.replace(/\.(csv|xlsx|xls)$/i, "");
  const datasetName = window.prompt("Name this dataset:", defaultName);
  input.value = ""; // allow re-selecting the same file later

  if (!datasetName) return; // user cancelled

  lastUploadedFile = file; // remembered for any recommendation chip clicked afterward

  addMessage("user", `Uploaded ${file.name} as dataset "${datasetName}"`);
  await streamRequest({ file, dataset_name: datasetName });
});

// Resume a saved session if there is one
const saved = localStorage.getItem("dataos_token");
if (saved) {
  token = saved;
  $("auth-screen").classList.add("hidden");
  $("chat-screen").classList.remove("hidden");
  $("user-greeting").textContent = "Welcome back";
  addMessage("bot", "Welcome back — what would you like to do?");
}
</script>
